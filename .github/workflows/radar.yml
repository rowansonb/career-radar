name: career-radar

on:
  schedule:
    - cron: "7 22 * * 0,3"   # 매주 월·목 오전 7:07 (한국 시간) — cron은 UTC 기준이라 일·수 22:07
  issues:
    types: [labeled]         # 인박스 Issue에 'inbox' 라벨 달면 바로 판정
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write
  issues: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'issues' || github.event.label.name == 'inbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 레이더 실행
        run: python -m radar.main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 결과 저장 (커밋)
        run: |
          git config user.name "career-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "radar: $(TZ=Asia/Seoul date +'%m/%d %H:%M') 업데이트"
          git push
