# 민아 전용 판정 기준 — Gemini가 이 파일을 읽고 공고마다 점수를 매겨요.
# 상황이 바뀌면 여기만 고치면 돼요. (코드 수정 필요 없음)

me:
  school: 울산대학교 AI융합전공 2학년 (2027년 3학년)
  location: 울산
  weekly_hours: 10          # 방학 중 쓸 수 있는 시간 (주당)
  target_roles: [서비스기획, PM, AX, 데이터분석]
  strengths: [생성형 AI로 웹서비스 직접 기획·제작, 공모전 다수 참가]
  gaps: [개발자와의 협업 경험, 직접 짠 코드 비중, SQL·데이터 분석]
  constraints:
    - 2027년 학생회 활동 예정 → 3개월 넘는 장기·풀타임 과정은 감점
    - 매주 서울 오프라인 참석은 어려움 (온라인·울산·부산 선호, 서울 1~2회는 OK)

must_pass:                  # 하나라도 어기면 '지원 불가'
  - 2~3학년 재학생이 지원할 수 있어야 함 (졸업자·졸업예정자 전용은 제외)
  - 마감이 지나지 않았어야 함

scoring:                    # 각 항목 0~5점, 가중치 곱해서 합산 → 100점 만점으로 환산
  role_fit:     {weight: 3, desc: "기획/PM/AX/데이터 직무와 결과물이 직접 연결되는가"}
  output:       {weight: 3, desc: "서비스·PRD·분석리포트·코드 등 포트폴리오에 쓸 결과물이 남는가"}
  tech_depth:   {weight: 2, desc: "직접 코딩하거나 데이터를 다루는 부분이 있는가 (문과+AI와 차별화)"}
  fills_gap:    {weight: 2, desc: "위 gaps(협업·코드·데이터) 중 하나를 채워주는가"}
  schedule_fit: {weight: 2, desc: "주 10시간 안에서 가능하고 3개월 이하 또는 방학 집중형인가"}
  location_fit: {weight: 1, desc: "온라인/울산/부산이거나 서울 오프라인이 1~2회 이하인가"}

priority_types:             # 참고용 우선순위 (높을수록 가산점)
  - IT 연합동아리 PM·기획 파트
  - AI 해커톤·공모전
  - 데이터 분석 경진대회
  - 방학 단기 부트캠프·기업 캠프 (8주 이하)

exclude_types:              # 이런 건 낮은 점수
  - 서포터즈·기자단·홍보대사
  - 6개월 이상 국비 부트캠프
