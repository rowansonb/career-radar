# 공고를 어디서 모을지.
# 1) rss: 공개 RSS 피드 (Google 뉴스 검색 RSS는 공개 피드라 안전하게 쓸 수 있어요)
# 2) inbox: GitHub Issue에 'inbox' 라벨을 달고 공고 링크를 올리면 다음 실행 때 판정해요
#    → 폰에서 링커리어 보다가 괜찮은 공고 있으면 링크만 던져 넣기
# 사이트를 직접 크롤링하는 건 약관·robots.txt 확인 후에 추가하기 (2단계)

rss:
  - name: 해커톤 모집
    url: "https://news.google.com/rss/search?q=%ED%95%B4%EC%BB%A4%ED%86%A4+%EB%AA%A8%EC%A7%91+%EB%8C%80%ED%95%99%EC%83%9D&hl=ko&gl=KR&ceid=KR:ko"
  - name: AI 공모전
    url: "https://news.google.com/rss/search?q=AI+%EA%B3%B5%EB%AA%A8%EC%A0%84+%EB%8C%80%ED%95%99%EC%83%9D+%EB%AA%A8%EC%A7%91&hl=ko&gl=KR&ceid=KR:ko"
  - name: 데이터 분석 경진대회
    url: "https://news.google.com/rss/search?q=%EB%8D%B0%EC%9D%B4%ED%84%B0+%EB%B6%84%EC%84%9D+%EA%B2%BD%EC%A7%84%EB%8C%80%ED%9A%8C+%EC%B0%B8%EA%B0%80%EC%9E%90+%EB%AA%A8%EC%A7%91&hl=ko&gl=KR&ceid=KR:ko"
  - name: 동계 부트캠프
    url: "https://news.google.com/rss/search?q=%EB%8F%99%EA%B3%84+%EB%B6%80%ED%8A%B8%EC%BA%A0%ED%94%84+%EB%8C%80%ED%95%99%EC%83%9D+%EB%AA%A8%EC%A7%91&hl=ko&gl=KR&ceid=KR:ko"
  - name: 울산 대학생 공모전
    url: "https://news.google.com/rss/search?q=%EC%9A%B8%EC%82%B0+%EB%8C%80%ED%95%99%EC%83%9D+%EA%B3%B5%EB%AA%A8%EC%A0%84&hl=ko&gl=KR&ceid=KR:ko"

max_items_per_feed: 15      # 피드당 최대 몇 개까지 가져올지 (Gemini 무료 한도 보호)
max_age_days: 14            # 이보다 오래된 기사는 건너뜀
