#    검색어를 바꾸고 싶으면 q= 뒤를 고치거나, 새 항목을 추가하면 돼요.
# 2) inbox: GitHub Issue에 'inbox' 라벨을 달고 공고 링크를 올리면 판정해요
#    → 폰에서 링커리어 보다가 괜찮은 공고 있으면 링크만 던져 넣기
